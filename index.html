<style>
/* Layout: one phone-width column. Sticky top bar with a back button, then the current screen (subjects, one subject, study card, or add material). */
:root {
  --bg: #eef3f1; --surface: #ffffff; --ink: #15211d; --muted: #5b6b65; --line: #d3ddd9;
  --accent: #0d6b5b; --accent-soft: #d6ebe5;
  --ok: #1f7a3d; --ok-soft: #e1f2e6; --bad: #b3361f; --bad-soft: #fbe7e2; --warn: #9a6200; --warn-soft: #fbefd6; --new: #c4d2cd;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1614; --surface: #17211e; --ink: #e4ece9; --muted: #95a8a1; --line: #2a3833;
  --accent: #4fc2a9; --accent-soft: #173a33; --ok: #5cc77f; --ok-soft: #16301f; --bad: #f08a72; --bad-soft: #3a1c16; --warn: #e6b45a; --warn-soft: #3a2c12; --new: #33433e;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1614; --surface: #17211e; --ink: #e4ece9; --muted: #95a8a1; --line: #2a3833;
  --accent: #4fc2a9; --accent-soft: #173a33; --ok: #5cc77f; --ok-soft: #16301f; --bad: #f08a72; --bad-soft: #3a1c16; --warn: #e6b45a; --warn-soft: #3a2c12; --new: #33433e;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px 4px; cursor: pointer; font-size: .95rem; white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.top h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.12rem; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.sync { font-size: .72rem; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="cloud"]::before { background: var(--ok); } .sync[data-s="local"]::before { background: var(--warn); }

main { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(48px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; margin: 0; }
.muted { color: var(--muted); } .small { font-size: .84rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--new); }
.bar > span { display: block; height: 100%; transition: width .4s ease; }
.bar .m { background: var(--accent); } .bar .l { background: var(--warn); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
.stats b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.key { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

.btn { font-weight: 700; border-radius: var(--r); padding: 11px 18px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; min-height: 44px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: var(--bad); border-color: var(--bad); }
.btn.big { width: 100%; font-size: 1.05rem; padding: 14px; }
.btn.small { font-size: .84rem; padding: 6px 12px; min-height: 36px; }
.btn:focus-visible, .linkbtn:focus-visible, .chipbtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.linkbtn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; font-size: .84rem; }
.chipbtn { font-size: .84rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 1.5px solid transparent; border-radius: 99px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.chipbtn:disabled { opacity: .55; cursor: progress; }
input[type=text], textarea, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

/* subjects */
.subj { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 8px; cursor: pointer; }
.subj:hover { border-color: var(--accent); }
.subj .name { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.sec { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.sec:first-of-type { border-top: 0; padding-top: 0; }
.sec .head { display: flex; gap: 10px; align-items: flex-start; }
.sec .head label { display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 0; cursor: pointer; }
.sec .nm { font-weight: 700; line-height: 1.3; }
.sec .num { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); white-space: nowrap; }
.sec .acts { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 30px; }
.sec .bar { margin-left: 30px; height: 6px; }
.sec.off .nm, .sec.off .bar { opacity: .45; }
.more { border: 1px dashed var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; margin-left: 30px; }
.src { display: flex; gap: 8px; align-items: center; font-size: .84rem; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .88rem; background: var(--bad-soft); padding: 10px 12px; border-radius: 10px; }

/* study card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.navrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: -4px; }
.navbtn { font-size: .86rem; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 6px 0; cursor: pointer; }
.navbtn:disabled { color: var(--muted); opacity: .5; cursor: default; }
.navinfo { font-size: .8rem; color: var(--muted); }
.navrow .btn.small { margin-left: auto; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: .78rem; }
.chip { font-family: var(--f-mono); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; font-size: .66rem; padding: 3px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.retry { background: var(--bad-soft); color: var(--bad); } .chip.review { background: var(--warn-soft); color: var(--warn); }
.chip.fmt { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.chip.orig { background: var(--ink); color: var(--surface); }
.chip.ai { background: var(--warn-soft); color: var(--warn); }
.topic { color: var(--muted); font-size: .78rem; min-width: 0; flex-basis: 100%; }
.dots { display: inline-flex; gap: 4px; margin-left: auto; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--accent); display: inline-block; }
.dots i.on { background: var(--accent); }
.scenario { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; font-size: .88rem; color: var(--muted); }
.scenario b { color: var(--ink); font-family: var(--f-display); font-weight: 600; display: block; }
.stem { font-size: 1.1rem; font-weight: 700; margin: 0; text-wrap: pretty; }
.hint { font-size: .82rem; color: var(--muted); margin-top: -6px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; cursor: pointer; min-height: 48px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .k { font-family: var(--f-mono); font-size: .8rem; width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.opt:disabled { cursor: default; }
.opt .body { min-width: 0; }
.opt .why { display: block; font-size: .84rem; margin-top: 4px; line-height: 1.4; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); } .opt.right .k { background: var(--ok); border-color: var(--ok); color: var(--surface); } .opt.right .why { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); } .opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--surface); } .opt.wrong .why { color: var(--bad); }
.opt.missed { border-color: var(--ok); border-style: dashed; } .opt.missed .why { color: var(--ok); }
.opt.dim { opacity: .55; } .opt.other .why { color: var(--muted); }
.tag { font-family: var(--f-mono); font-size: .62rem; letter-spacing: .05em; text-transform: uppercase; margin-left: 6px; }
.quote { font-size: .84rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.verdict { font-weight: 800; font-family: var(--f-display); font-size: 1.05rem; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.note { font-size: .85rem; color: var(--muted); }
.actions .btn { margin-left: auto; }
.flagrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.addbox { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.addmsg { font-size: .8rem; color: var(--muted); }
.fbform { border: 1.5px solid var(--warn); background: var(--warn-soft); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reason { position: relative; }
.reason input { position: absolute; opacity: 0; pointer-events: none; }
.reason span { display: inline-block; font-size: .84rem; padding: 6px 11px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.reason input:checked + span { border-color: var(--warn); background: var(--warn); color: var(--surface); }
.reason input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
.fbmsg { font-size: .86rem; color: var(--warn); font-weight: 700; }
.fbitem { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: .86rem; }
.fbitem .q { font-weight: 700; }
.done { text-align: center; padding: 24px 6px; display: grid; gap: 10px; justify-items: center; }

/* import */
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.pickrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { position: relative; display: grid; place-items: center; text-align: center; gap: 2px; padding: 14px 8px; border-radius: 12px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; cursor: pointer; min-height: 64px; }
.pick small { font-weight: 400; color: var(--muted); font-size: .74rem; }
.pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.pick:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
.pastebox { min-height: 92px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; }
.pastebox:empty::before { content: attr(data-ph); color: var(--muted); }
.pastebox:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.mats { display: grid; gap: 6px; }
.mat { display: flex; gap: 8px; align-items: center; font-size: .86rem; border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 10px; }
.mat .k { font-family: var(--f-mono); font-size: .64rem; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 5px; }
.mat .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mat button { background: none; border: 0; color: var(--muted); font-size: 1.2rem; padding: 2px 8px; cursor: pointer; }
.progress { display: grid; gap: 6px; }
.prev { display: grid; gap: 8px; }
.pq { display: grid; grid-template-columns: auto 1fr; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: .88rem; align-items: start; }
.pq .q { font-weight: 700; }
.pq .a { color: var(--ok); }
.pq .meta { margin-top: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: .88rem; max-width: calc(100% - 32px); z-index: 20; box-shadow: 0 4px 18px rgb(0 0 0 / .2); }
.qzhead { display: flex; align-items: center; gap: 12px; }
.qzpos { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; flex: 1; }
.qztime { font-family: var(--f-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--accent-soft); padding: 4px 10px; border-radius: 8px; }
.qzact { justify-content: space-between; }
.qzact .btn { margin-left: 0; min-width: 110px; }
.qzscore { align-items: center; text-align: center; }
.qzscore .big { font-family: var(--f-display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.qzscore .big.ok { color: var(--ok); } .qzscore .big.bad { color: var(--bad); }
.qzscore .pct { font-family: var(--f-mono); color: var(--muted); }
.qzscore .stats, .qzscore .row { justify-content: center; }
.qzsec { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: .88rem; }
.qzsec .bar { grid-column: 1 / -1; height: 6px; }
.qzsec .num { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.qzrev { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.qzrev.miss { border-color: var(--bad); }
.qzrev .stem { font-size: 1rem; }
.qzhist { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.qzhist b { font-family: var(--f-mono); font-weight: 500; }
.empty { text-align: center; padding: 28px 10px; display: grid; gap: 8px; justify-items: center; }
.kbd { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
@media (hover: none) { .kbd { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
html { -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); overscroll-behavior-y: none; }
.sync { display: none; }
.install { border-color: var(--accent); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .92rem; }
.librow { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.librow .nm { font-weight: 700; }
#reportcopy { font-family: var(--f-mono); font-size: 12px; }
</style>

<header class="top"><div class="in" id="topbar"></div></header>
<main id="main"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- Math generators: new numbers every time ----------
const MATH_SEC = "Math, Measurement, and Calculations";
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const rnd = (x, p = 4) => Math.round(x * Math.pow(10, p)) / Math.pow(10, p);
const fmt = (x, p = 4) => { const v = rnd(x, p); return (Object.is(v, -0) ? 0 : v).toLocaleString("en-US", { maximumFractionDigits: p, useGrouping: false }); };
const pad2 = (n) => String(n).padStart(2, "0");
function gcd(a, b) { return b ? gcd(b, a % b) : Math.abs(a); }

// Build an MC from answer + candidate wrongs [[text, why]...]; keeps 3 unique ones != answer.
function mc(stem, ans, ex, cands, st) {
  const seen = new Set([String(ans)]); const w = [];
  for (const c of cands) { if (c && c[0] != null && !seen.has(String(c[0])) && w.length < 3) { seen.add(String(c[0])); w.push([String(c[0]), c[1]]); } }
  const mm = String(ans).match(/^(\d+(?:\.\d+)?)(.*)$/);
  if (w.length < 3 && mm) {
    const x = +mm[1], dp = (mm[1].split(".")[1] || "").length;
    for (const y of [x * 2, x / 2, x + 1, x - 1, x + 10, x * 10]) {
      const t = (dp ? y.toFixed(dp) : fmt(y, 2)) + mm[2];
      if (y > 0 && !seen.has(t) && w.length < 3) { seen.add(t); w.push([t, "Recheck the calculation step by step."]); }
    }
  }
  return { kind: "mc", stem, a: String(ans), ex, w, st };
}

const std = (h, m) => `${h % 12 === 0 ? 12 : h % 12}:${pad2(m)} ${h < 12 ? "AM" : "PM"}`;
const mil = (h, m) => pad2(((h % 24) + 24) % 24) + pad2(m);

function toRoman(n) {
  const t = [[100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let s = ""; for (const [v, r] of t) while (n >= v) { s += r; n -= v; } return s;
}
function additiveRoman(n) {
  const t = [[100, "C"], [50, "L"], [10, "X"], [5, "V"], [1, "I"]];
  let s = ""; for (const [v, r] of t) while (n >= v) { s += r; n -= v; } return s;
}
const ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
const TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
function words(n) {
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : "");
  return ONES[Math.floor(n / 100)] + " hundred" + (n % 100 ? " " + words(n % 100) : "");
}
const PCT = [[25, 1, 4], [50, 1, 2], [75, 3, 4], [20, 1, 5], [40, 2, 5], [60, 3, 5], [80, 4, 5], [10, 1, 10], [30, 3, 10], [70, 7, 10], [90, 9, 10], [5, 1, 20], [15, 3, 20], [35, 7, 20], [45, 9, 20], [12.5, 1, 8], [37.5, 3, 8], [62.5, 5, 8]];
const HH = { tsp: [5, "teaspoon", "teaspoons"], tbsp: [15, "tablespoon", "tablespoons"], oz: [30, "ounce", "ounces"], cup: [240, "cup", "cups"] };
const unit = (n, u) => `${fmt(n)} ${n === 1 ? HH[u][1] : HH[u][2]}`;

const GENS = [
  // ---- From the question bank (numbers change every time) ----
  { id: "b146", label: "Ounces and milliliters", from: 146, make() {

  if (i >= 0 && i < cur.q.opts.length) { e.preventDefault(); choose(i); }
});

// ================= "Add 2 more like this" =================
function placeSoon(ids) {
  const unseen = []; S.order.forEach((id, i) => { if (!S.it[id] && active(id)) unseen.push(i); });
  ids.forEach((id, k) => { const want = k === 0 ? ri(1, 4) : ri(6, 11); const pos = unseen.length > want ? unseen[want] + k : S.order.length; S.order.splice(Math.min(pos, S.order.length), 0, id); });
}
function addMore(id, b) {
  const item = ITEMS.get(id); if (!item) return;
  const baseId = item.extraOf || id; const base = ITEMS.get(baseId);
  const stamp = Date.now().toString(36); const ids = [`${baseId}~${stamp}a`, `${baseId}~${stamp}b`];
  const entries = ids.map((nid) => ({ id: nid, base: baseId, src: base.gen ? "gen" : "alt" }));
  S.extra = [...S.extra, ...entries]; registerExtras(entries); placeSoon(ids); persist();
  $("addmsg").textContent = base.gen ? "Added 2 more with new numbers. They'll come up soon." : "Added 2 more in different wording. They'll come up soon.";
  b.disabled = true; setTimeout(() => { b.disabled = false; }, 800);
}

// ================= Reports (kept on this phone, copied to Claude) =================
const REASONS = ["The marked answer is wrong", "More than one answer could be right", "The numbers or math don't add up", "The wording is confusing", "The explanation doesn't help", "Typo or formatting", "Other"];
let reports = lsGet("md-reports", []);
function openReport(ctx) {
  if (!ctx || $("fbform")) return;
  const f = el("form", "fbform"); f.id = "fbform"; f.append(el("h3", null, "What's wrong with this question?"));
  const rs = el("div", "reasons"); REASONS.forEach((r, i) => { const l = el("label", "reason"); const cb = el("input"); cb.type = "checkbox"; cb.id = "fbr" + i; cb.value = r; l.append(cb, el("span", null, r)); rs.append(l); });
  const ta = el("textarea"); ta.id = "fbnote"; ta.rows = 3; ta.placeholder = "Optional: what should the answer be, or what confused you?"; ta.setAttribute("aria-label", "Details");
  const sk = el("label", "row small"); const skc = el("input"); skc.type = "checkbox"; skc.id = "fbskip"; sk.append(skc, "Skip this question until it's fixed");
  const msg = el("span", "fbmsg"); const send = el("button", "btn", "Save report"); send.type = "submit";
  const br = el("div", "row"); br.append(send, btn("btn ghost", "Cancel", () => f.remove()), msg);
  f.append(rs, ta, sk, br);
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const reasons = [...f.querySelectorAll(".reason input:checked")].map((x) => x.value); const note = ta.value.trim();
    if (!reasons.length && !note) { msg.textContent = "Pick a reason or write a note."; return; }
    const q = ctx.q;
    reports.push({ id: uidGen("r"), sid: SID, item: ctx.id, label: labelFor(ITEMS.get(ctx.id) || {}), version: q.tag ? q.tag[0] : "", stem: q.stem,
      options: q.opts.map((o) => (o.c ? "[marked correct] " : "") + o.t), answered: !!ctx.answered, chose: ctx.answered ? [...ctx.picks].map((i) => q.opts[i].t) : [], reasons, note, skip: skc.checked, at: Date.now() });
    lsSet("md-reports", reports);
    if (skc.checked) { S.skip = [...new Set([...S.skip, ctx.id])]; persist(); }
    f.removeAttribute("id"); f.replaceChildren(el("span", "fbmsg", "Saved. On the subject page, tap “Copy reports for Claude” and paste them into your chat so they get fixed."));
    if (skc.checked && ctx.live && !(cur && cur.answered)) { const nx = btn("btn", "Next question", () => show(cur && cur.id)); f.append(nx); nx.focus(); }
  });
  $("card").append(f); f.querySelector("input").focus();
}
function reportsText(list) {
  const name = subjects[SID] ? subjects[SID].name : "";
  return [`Problem reports from Mastery Deck · ${name} (${list.length})`, ""].concat(list.map((r, i) => [
    `${i + 1}. ${r.label}${r.version ? " · " + r.version + " version" : ""}`,
    `   Question: ${r.stem}`,
    `   Choices: ${r.options.join(" | ")}`,
    r.answered ? `   I chose: ${r.chose.join(", ") || "(nothing)"}` : "",
    r.reasons.length ? `   Problem: ${r.reasons.join("; ")}` : "",
    r.note ? `   Note: ${r.note}` : ""].filter(Boolean).join("\n"))).join("\n");
}
async function copyReports(list, box) {
  const text = reportsText(list);
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into your Claude chat."); return; } catch (e) {}
  const ta = el("textarea"); ta.value = text; ta.rows = 8; ta.readOnly = true; ta.id = "reportcopy"; box.append(el("p", "small muted", "Select all of this text, copy it, and paste it into your Claude chat:"), ta); ta.focus(); ta.select();
}
function renderReports() {
  const box = $("reports"); if (!box) return; box.replaceChildren();
  const list = reports.filter((r) => r.sid === SID).sort((a, b) => b.at - a.at);
  box.append(el("h3", null, `Reported questions (${list.length})`));
  if (!list.length) { box.append(el("p", "small muted", "Nothing reported. Tap “Report a problem” under any question to flag it here.")); return; }
  box.append(btn("btn ghost", "Copy reports for Claude", () => copyReports(list, box)));
  for (const r of list) {
    const d = el("div", "fbitem");
    d.append(el("span", "small muted", `${r.label} · ${new Date(r.at).toLocaleDateString([], { month: "short", day: "numeric" })}`), el("span", "q", r.stem));
    if (r.reasons && r.reasons.length) d.append(el("span", "small", r.reasons.join(" · ")));
    if (r.note) d.append(el("span", "small", "“" + r.note + "”"));
    const row = el("div", "row");
    if (S.skip.includes(r.item)) row.append(btn("linkbtn", "Put back in the quiz", () => { S.skip = S.skip.filter((x) => x !== r.item); persist(); renderSubject(); }));
    row.append(btn("linkbtn", "Delete report", () => { reports = reports.filter((x) => x !== r); lsSet("md-reports", reports); renderReports(); }));
    d.append(row); box.append(d);
  }
}

// ================= QUIZ ME (timed practice test) =================
const QUIZ_LEN = 50;
let QZ = null;        // {sid, sec, items:[{id,q}], ans:[[i]], i, elapsed, runSince, paused, done, result}
let qzTick = null, qzConfirm = false, qzFilter = "missed";
const loadQZ = (sid) => { const q = lsGet("md-quiz-" + sid, null); if (q && !q.done) { q.paused = true; q.runSince = null; } return q; };
const saveQZ = () => { if (!QZ) return; if (!QZ.done && !QZ.paused && QZ.runSince) { QZ.elapsed = qzElapsed(); QZ.runSince = Date.now(); } lsSet("md-quiz-" + QZ.sid, QZ); };
document.addEventListener("visibilitychange", () => { if (document.hidden && QZ && !QZ.done) saveQZ(); });
const qzElapsed = () => (QZ ? QZ.elapsed + (QZ.paused || !QZ.runSince ? 0 : Date.now() - QZ.runSince) : 0);
const fmtTime = (ms) => { const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
function quizPool(sec) {
  return S.order.filter((id) => { const it = ITEMS.get(id); return it && !it.extraOf && !S.skip.includes(id) && (sec ? it.sec === sec : !S.off.includes(it.sec)); });
}
function startQuiz(sid, sec) {
  const pool = quizPool(sec); if (!pool.length) { toast("No questions to quiz you on yet."); return; }
  const pick = shuffle(pool).slice(0, QUIZ_LEN);
  QZ = { sid, sec: sec || null, items: pick.map((id) => ({ id, q: build(ITEMS.get(id), Math.random() < 0.5, null) })), ans: pick.map(() => []), i: 0, elapsed: 0, runSince: Date.now(), paused: false, done: false };
  qzConfirm = false; saveQZ(); go({ v: "quiz", sid });
}
function pauseQuiz() { if (!QZ || QZ.paused) return; QZ.elapsed = qzElapsed(); QZ.paused = true; QZ.runSince = null; saveQZ(); renderQuiz(); }
function resumeQuiz() { if (!QZ) return; QZ.paused = false; QZ.runSince = Date.now(); saveQZ(); renderQuiz(); }
function quizScope(q) { return q.sec ? secName(q.sec) : "Whole subject"; }

async function renderQuiz() {
  const sid = route.sid; const s = subjects[sid]; if (!s) { go({ v: "home" }); return; }
  if (SID !== sid || !S) { $("main").replaceChildren(el("p", "muted", "Loading questions…")); await openSubject(sid); if (route.v !== "quiz") return; }
  if (!QZ || QZ.sid !== sid) QZ = loadQZ(sid);
  if (!QZ) { go({ v: "subject", sid }); return; }
  topbar(s.name, () => { if (QZ && !QZ.done) pauseQuiz(); go({ v: "subject", sid }); }, QZ.done ? "Quiz results" : "Quiz me");
  clearInterval(qzTick);
  if (QZ.done) return renderResults();
  const m = $("main"); m.replaceChildren();
  const n = QZ.items.length, answered = QZ.ans.filter((a) => a.length).length;
  const head = el("div", "qzhead");
  head.append(el("span", "qzpos", `Question ${QZ.i + 1} of ${n}`));
  const tm = el("span", "qztime"); tm.id = "qztime"; tm.textContent = fmtTime(qzElapsed()); head.append(tm);
  head.append(QZ.paused ? btn("btn small", "Resume", resumeQuiz) : btn("btn ghost small", "Pause", pauseQuiz));
  const bar = el("div", "bar"); const b1 = el("span", "m"); b1.style.width = (answered / n * 100) + "%"; bar.append(b1);
  m.append(head, bar, el("span", "small muted", `${quizScope(QZ)} · ${answered} answered · answers are shown at the end`));
  if (QZ.paused) {
    const p = el("div", "panel empty"); p.append(el("h3", null, "Paused"), el("p", "small muted", "The timer is stopped. The question is hidden until you resume."), btn("btn", "Resume quiz", resumeQuiz));
    m.append(p); return;
  }
  qzTick = setInterval(() => { const t = $("qztime"); if (!t || route.v !== "quiz") { clearInterval(qzTick); return; } t.textContent = fmtTime(qzElapsed()); if (Date.now() % 5000 < 1000) saveQZ(); }, 1000);
  const { id, q } = QZ.items[QZ.i]; const item = ITEMS.get(id);
  const card = el("section", "card"); card.id = "card";
  const meta = el("div", "meta"); meta.append(el("span", "chip fmt", FMT_NAME[q.fmt])); if (item) meta.append(el("span", "topic", secName(item.sec)));
  card.append(meta);
  const list = body(card, q);
  if (q.fmt === "ms") list.before(el("div", "hint", "Choose every correct answer."));
  const sel = new Set(QZ.ans[QZ.i]);
  list.querySelectorAll(".opt").forEach((b, k) => { b.classList.toggle("sel", sel.has(k)); b.addEventListener("click", () => quizPick(k)); });
  const act = el("div", "actions qzact");
  const back = btn("btn ghost", "‹ Back", () => quizMove(-1)); back.disabled = QZ.i === 0;
  const last = QZ.i === n - 1;
  const nx = btn("btn", last ? "Finish quiz" : sel.size ? "Next ›" : "Skip ›", () => (last ? finishQuiz() : quizMove(1))); nx.id = "qznext";
  act.append(back, nx); card.append(act);
  const end = el("div", "row");
  if (qzConfirm) {
    const c = el("div", "confirm"); c.append(el("span", "grow", `Finish now? ${n - answered} unanswered question${n - answered === 1 ? "" : "s"} will count as wrong.`), btn("btn danger small", "Finish now", finishQuiz), btn("btn ghost small", "Keep going", () => { qzConfirm = false; renderQuiz(); }));
    end.append(c);
  } else end.append(btn("linkbtn", "Finish early", () => { qzConfirm = true; renderQuiz(); }), btn("linkbtn", "Quit without saving", () => { const sid2 = QZ.sid; try { localStorage.removeItem("md-quiz-" + sid2); } catch (e) {} QZ = null; go({ v: "subject", sid: sid2 }); }));
  card.append(end);
  m.append(card);
}
function quizPick(k) {
  if (!QZ || QZ.done || QZ.paused) return;
  const q = QZ.items[QZ.i].q; let a = QZ.ans[QZ.i];
  if (q.fmt === "ms") a = a.includes(k) ? a.filter((x) => x !== k) : [...a, k]; else a = [k];
  QZ.ans[QZ.i] = a; saveQZ();
  document.querySelectorAll("#card .opt").forEach((b, j) => b.classList.toggle("sel", a.includes(j)));
  const nx = $("qznext"); if (nx && QZ.i < QZ.items.length - 1) nx.textContent = a.length ? "Next ›" : "Skip ›";
  const answered = QZ.ans.filter((x) => x.length).length; const bm = document.querySelector("main > .bar .m"); if (bm) bm.style.width = (answered / QZ.items.length * 100) + "%";
}
function quizMove(d) { if (!QZ) return; QZ.i = Math.max(0, Math.min(QZ.items.length - 1, QZ.i + d)); qzConfirm = false; saveQZ(); renderQuiz(); window.scrollTo(0, 0); }
function finishQuiz() {
  if (!QZ) return; clearInterval(qzTick);
  const ms = qzElapsed(); QZ.elapsed = ms; QZ.paused = true; QZ.runSince = null;
  const bySec = {}; let correct = 0;
  QZ.items.forEach(({ id, q }, k) => {
    const picks = new Set(QZ.ans[k]); const ok = picks.size > 0 && q.opts.every((o, j) => o.c === picks.has(j));
    if (ok) correct++; const sec = (ITEMS.get(id) || {}).sec || "?"; bySec[sec] = bySec[sec] || [0, 0]; bySec[sec][1]++; if (ok) bySec[sec][0]++;
  });
  QZ.result = { at: Date.now(), n: QZ.items.length, correct, ms, sec: QZ.sec, bySec, answered: QZ.ans.filter((a) => a.length).length };
  QZ.done = true; qzConfirm = false; qzFilter = correct === QZ.items.length ? "all" : "missed"; saveQZ();
  S.quizzes = [...(S.quizzes || []), { at: QZ.result.at, n: QZ.result.n, correct, ms, sec: QZ.sec }].slice(-20); persist(true);
  renderQuiz(); window.scrollTo(0, 0);
}
function renderResults() {
  const m = $("main"); m.replaceChildren(); const r = QZ.result; const pct = Math.round(r.correct / r.n * 100);
  const top = el("div", "panel qzscore");
  top.append(el("span", "small muted", quizScope(QZ)), el("div", "big " + (pct >= 70 ? "ok" : "bad"), `${r.correct}/${r.n}`), el("div", "pct", `${pct}%`));
  const st2 = el("div", "stats"); const add = (l, v) => { const sp = el("span"); sp.append(l + " ", Object.assign(el("b"), { textContent: v })); st2.append(sp); };
  add("Time", fmtTime(r.ms)); add("Per question", fmtTime(r.ms / r.n)); if (r.answered < r.n) add("Skipped", r.n - r.answered);
  top.append(st2);
  const prev = (S.quizzes || []).filter((x) => x.at !== r.at && (x.sec || null) === (QZ.sec || null)).slice(-1)[0];
  if (prev) { const pp = Math.round(prev.correct / prev.n * 100); top.append(el("span", "small muted", `Last time: ${pp}% in ${fmtTime(prev.ms)} (${pct - pp >= 0 ? "+" : ""}${pct - pp} points)`)); }
  const missedIds = QZ.items.filter((_, k) => !isRight(k)).map((x) => x.id);
  const acts = el("div", "row");
  if (missedIds.length) acts.append(btn("btn", `Practice the ${missedIds.length} I missed`, () => {
    for (const id of missedIds) { const s = S.it[id] || (S.it[id] = { c: 0, due: null, ok: 0, bad: 0 }); s.c = 0; s.m = 0; s.due = S.n; }
    persist(true); toast(`${missedIds.length} missed questions moved to the front of your study queue.`); cur = null; go({ v: "study", sid: QZ.sid });
  }));
  acts.append(btn("btn ghost", "Take another quiz", () => startQuiz(QZ.sid, QZ.sec)));
  top.append(acts); m.append(top);
  const secs = Object.entries(r.bySec);
  if (secs.length > 1) {
    const bp = el("div", "panel"); bp.append(el("h3", null, "By subsection"));
    secs.sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).forEach(([sec, [c, t]]) => {
      const row = el("div", "qzsec"); row.append(el("span", "nm", secName(sec)), el("span", "num", `${c}/${t}`));
      const b = el("div", "bar"); const x = el("span", "m"); x.style.width = (c / t * 100) + "%"; b.append(x); row.append(b); bp.append(row);
    });
    m.append(bp);
  }
  const rv = el("div", "panel"); const hd = el("div", "row"); hd.append(el("h3", "grow", "Review your answers"));
  const tg = btn("linkbtn", qzFilter === "missed" ? `Show all ${r.n}` : `Show only missed (${missedIds.length})`, () => { qzFilter = qzFilter === "missed" ? "all" : "missed"; renderResults(); });
  hd.append(tg); rv.append(hd);
  QZ.items.forEach(({ id, q }, k) => {
    const ok = isRight(k); if (qzFilter === "missed" && ok) return;
    const c = el("div", "qzrev " + (ok ? "good" : "miss"));
    const meta = el("div", "meta"); meta.append(el("span", "chip " + (ok ? "" : "retry"), `${k + 1} · ${ok ? "Right" : QZ.ans[k].length ? "Missed" : "Skipped"}`), el("span", "chip fmt", FMT_NAME[q.fmt]));
    const item = ITEMS.get(id); if (item) meta.append(el("span", "topic", secName(item.sec)));
    c.append(meta); body(c, q, "r" + k + "-"); applyFeedback(c, q, new Set(QZ.ans[k]), ok, true); rv.append(c);
  });
  if (qzFilter === "missed" && !missedIds.length) rv.append(el("p", "small muted", "You got every question right."));
  m.append(rv);
  m.append(btn("btn ghost big", "Back to subject", () => go({ v: "subject", sid: QZ.sid })));
}
function isRight(k) { const q = QZ.items[k].q; const p = new Set(QZ.ans[k]); return p.size > 0 && q.opts.every((o, j) => o.c === p.has(j)); }
function quizPanel(sid, s) {
  const p = el("div", "panel"); const q = (!QZ || QZ.sid !== sid) ? loadQZ(sid) : QZ;
  const pool = quizPool(null).length;
  p.append(el("h3", null, "Quiz me"));
  if (q && !q.done) {
    QZ = q; const answered = q.ans.filter((a) => a.length).length;
    p.append(el("p", "small muted", `Quiz in progress: ${answered} of ${q.items.length} answered · ${fmtTime(q.elapsed)} so far.`));
    const r = el("div", "row"); r.append(btn("btn", "Resume quiz", () => go({ v: "quiz", sid })), btn("btn ghost", "Start a new one", () => startQuiz(sid, null))); p.append(r);
  } else {
    p.append(el("p", "small muted", `${Math.min(QUIZ_LEN, pool)} random questions from the subsections checked below, timed. Answers are shown at the end, and your study progress isn't changed.`));
    const b = btn("btn ghost big", `Quiz me · ${Math.min(QUIZ_LEN, pool)} questions`, () => startQuiz(sid, null)); b.disabled = !pool; p.append(b);
  }
  const hist = (S.quizzes || []).slice().reverse().slice(0, 5);
  if (hist.length) {
    const h = el("div", "qzhist"); h.append(el("span", "small muted", "Recent quizzes"));
    for (const x of hist) { const pct = Math.round(x.correct / x.n * 100); const r = el("div", "row small"); r.append(el("span", "grow", `${new Date(x.at).toLocaleDateString([], { month: "short", day: "numeric" })} · ${x.sec ? secName(x.sec) : "Whole subject"}`), el("b", null, `${pct}%`), el("span", "muted", `${x.correct}/${x.n} · ${fmtTime(x.ms)}`)); h.append(r); }
    if (q && q.done) h.append(btn("linkbtn", "See last results", () => { QZ = q; go({ v: "quiz", sid }); }));
    p.append(h);
  }
  return p;
}

async function boot() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  rerender();
  await loadLibrary();
  if (!lsGet("md-booted", false) && library) {
    for (const e of library.filter((x) => x.auto)) { try { await installDeck(await fetchDeck(e)); } catch (err) {} }
    lsSet("md-booted", true);
  }
  if (route.v === "home") renderHome();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
}

boot();
})();
