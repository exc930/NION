        occ.boxes.forEach((b, i) => { const d = el("div", "obox"); d.style.left = b.x + "%"; d.style.top = b.y + "%"; d.style.width = b.w + "%"; d.style.height = b.h + "%"; d.append(el("span", "n", String(i + 1))); d.dataset.i = i; ed.append(d); });
        labels.replaceChildren();
        occ.boxes.forEach((b, i) => { const r = el("div", "ordrow"); const x = inp("w-lab" + i, "What's under box " + (i + 1) + "?", "Label " + (i + 1)); x.value = b.t || ""; x.addEventListener("input", () => { b.t = x.value; }); const del = btn("linkbtn", "×", () => { occ.boxes.splice(i, 1); draw(); }); del.setAttribute("aria-label", "Remove box " + (i + 1)); r.append(el("span", "n", String(i + 1)), x, del); labels.append(r); });
        if (!occ.boxes.length) labels.append(note("No boxes yet."));
      };
      let st = null, tmp = null;
      const pt = (e) => { const r = ed.getBoundingClientRect(); return { x: Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100)), y: Math.max(0, Math.min(100, (e.clientY - r.top) / r.height * 100)) }; };
      ed.addEventListener("pointerdown", (e) => { if (e.button > 0) return; e.preventDefault(); st = pt(e); st.target = e.target.closest(".obox"); tmp = el("div", "obox tmp"); ed.append(tmp); try { ed.setPointerCapture(e.pointerId); } catch (err) {} });
      ed.addEventListener("pointermove", (e) => { if (!st) return; const p = pt(e); Object.assign(tmp.style, { left: Math.min(st.x, p.x) + "%", top: Math.min(st.y, p.y) + "%", width: Math.abs(p.x - st.x) + "%", height: Math.abs(p.y - st.y) + "%" }); });
      const up = (e) => {
        if (!st) return; const p = pt(e); const s0 = st; st = null; tmp.remove();
        let w = Math.abs(p.x - s0.x), h = Math.abs(p.y - s0.y);
        if (w < 2.5 && h < 2.5) {
          if (s0.target) { occ.boxes.splice(+s0.target.dataset.i, 1); draw(); return; }
          w = 24; h = 8; const x = Math.max(0, Math.min(100 - w, s0.x - w / 2)), y = Math.max(0, Math.min(100 - h, s0.y - h / 2)); occ.boxes.push({ x, y, w, h, t: "" });
        } else occ.boxes.push({ x: Math.min(s0.x, p.x), y: Math.min(s0.y, p.y), w: Math.max(w, 3), h: Math.max(h, 3), t: "" });
        draw(); const last = $("w-lab" + (occ.boxes.length - 1)); if (last) last.focus({ preventScroll: true });
      };
      ed.addEventListener("pointerup", up); ed.addEventListener("pointercancel", () => { st = null; if (tmp) tmp.remove(); });
      const q = inp("w-q", "What is under the highlighted box?", "Question wording");
      f.append(ed, labels, btn("linkbtn", "Use a different picture", () => { snap(); imp.occ = null; renderImport(); }), lab("Question wording (optional)"), q);
      draw();
      collect = () => {
        const done = occ.boxes.filter((b) => str(b.t)).map((b) => ({ x: +b.x.toFixed(2), y: +b.y.toFixed(2), w: +b.w.toFixed(2), h: +b.h.toFixed(2), t: str(b.t) }));
        if (!done.length) fail("Cover at least one label and type what it says.");
        if (occ.boxes.some((b) => !str(b.t))) fail("Type the label for every box, or remove the empty ones.");
        return done.map((b, i) => ({ k: "img", im: occ.id, boxes: done, hi: i, q: val(q) }));
      };
    }
  }
  // optional picture with the question
  if (kind !== "img") {
    const pw = el("div", "picrow");
    if (imp.wpic) { const th = el("img", "pthumb"); th.src = imp.wpic.data; th.alt = "Picture for this question"; pw.append(th, btn("linkbtn", "Remove picture", () => { snap(); imp.wpic = null; renderImport(); })); }
    else { const pk = el("label", "pick small"); pk.append("+ Add a picture (optional)"); const fi = el("input"); fi.type = "file"; fi.accept = "image/*"; fi.id = "w-pic"; fi.addEventListener("change", async () => { const file = fi.files[0]; fi.value = ""; if (!file) return; snap(); imp.wpic = { id: uidGen("im"), data: await picFromFile(file) }; renderImport(); }); pk.append(fi); pw.append(pk); }
    f.append(pw);
  }
  const ex = area("w-ex", "Optional: why the answer is right", 2, "Explanation");
  f.append(lab("Explanation (optional)"), ex);
  let aiBox = null;
  if (kind !== "img") {
    if (apiKey()) { const l = el("label", "row small"); aiBox = el("input"); aiBox.type = "checkbox"; aiBox.id = "w-ai"; aiBox.checked = imp.wai !== false; aiBox.addEventListener("change", () => { imp.wai = aiBox.checked; }); l.append(aiBox, kind === "mc" ? "Also make 2 reworded versions and fill in missing wrong answers (uses your API key)" : "Also make 2 reworded versions (uses your API key)"); f.append(l); }
    else f.append(note("Tip: with an API key in Settings, Nion also writes 2 reworded versions of each question you type."));
  }
  const msg = el("p", "small warnline"); msg.id = "w-msg";
  const save = el("button", "btn big", kind === "img" ? "Save picture questions" : "Save question"); save.type = "submit";
  const row = el("div", "row"); row.append(save, btn("btn ghost", "Done", () => { imp.mode = null; imp.occ = null; imp.wpic = null; imp.wdraft = null; renderImport(); }));
  f.append(msg, row);
  if (imp.wdraft) for (const [id, v] of Object.entries(imp.wdraft)) { const x = f.querySelector("#" + id); if (!x) continue; if (x.type === "checkbox") x.checked = !!v; else { x.value = v; x.dispatchEvent(new Event("input")); } }
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); msg.textContent = "";
    let items; try { items = collect(); } catch (err) { msg.textContent = err.message; if (err.el) err.el.focus(); return; }
    items = Array.isArray(items) ? items : [items];
    const exv = val(ex); items.forEach((it) => { if (exv) it.ex = exv; it.src = "Written by you"; });
    const imgs = {};
    if (kind === "img") imgs[imp.occ.id] = imp.occ.data;
    else if (imp.wpic) { items[0].im = imp.wpic.id; imgs[imp.wpic.id] = imp.wpic.data; }
    save.disabled = true;
    if (aiBox && aiBox.checked) { save.textContent = "Writing reworded versions…"; try { Object.assign(items[0], await reworkOwn(items[0])); } catch (err) { msg.textContent = err.message + " Saved without reworded versions."; } }
    imp.wdraft = null;
    await addOwnItems(imp.sid, imp.sec, items, kind === "img" ? "Picture labels" : "Written by you", imgs, kind !== "img");
    toast(kind === "img" ? `Saved ${items.length} picture question${items.length > 1 ? "s" : ""}.` : "Question saved.");
    if (route.v === "import" && imp) { imp.wkind = kind; imp.wpic = null; imp.wdraft = null; if (kind === "img") imp.occ = null; renderImport(); setTimeout(() => { const x = $("w-q"); if (x && kind !== "img") x.focus(); }, 60); }
  });
  m.append(f);
}
async function reworkOwn(item) {
  const k = item.k; const needWrong = k === "mc" && !(item.w && item.w.length);
  const shown = { k, q: item.q };
  if (k === "mc" || k === "tf") shown.a = item.a;
  if (k === "mc" && !needWrong) shown.wrong = item.w.map((w) => w[0]);
  if (k === "ms") shown.opts = item.o.map(([t, c]) => ({ t, c }));
  if (k === "ord") shown.items = item.items;
  if (k === "match") shown.pairs = item.pairs;
  if (item.ex) shown.ex = item.ex;
  const ask = [!item.ex ? '"ex":"one short sentence explaining the answer"' : null,
    needWrong ? '"wrong":[3 objects {"t":"plausible wrong answer, similar length to the right one","why":"why it is wrong"}]' : null,
    k === "mc" && !needWrong ? '"why":["one short sentence why each wrong answer is wrong, in the same order"]' : null,
    k === "tf" ? '"ww":"one short sentence why the opposite is wrong"' : null,
    k === "ms" ? '"whys":["one short sentence per option, in the same order, saying why it is right or wrong"]' : null].filter(Boolean);
  const prompt = `A student wrote this ${KIND_USE[k]} question for their quiz app. Treat their answer as correct.
${JSON.stringify(shown)}${k === "fb" ? "\n(Words in [[double brackets]] are the blanks; | separates other accepted answers.)" : ""}
Reply with only JSON: {${ask.join(",")}${ask.length ? "," : ""}"alt":[exactly 2 reworded versions, each in this shape: ${SHAPE[k]}. One paraphrase in clearly different words, one applied example or different angle. Same type, same correct answer meaning.]}`;
  const { text } = await callClaude([{ type: "text", text: prompt }], { maxTokens: 3000 });
  const out = parseLooseJSON(text) || {}; const extra = {};
  if (!item.ex && str(out.ex)) extra.ex = str(out.ex);
  if (needWrong) { const n = normQ({ q: item.q, a: item.a, wrong: out.wrong }, "mc"); if (n) extra.w = n.w; }
  if (k === "mc" && !needWrong && Array.isArray(out.why)) extra.w = item.w.map((w, i) => [w[0], str(out.why[i])]);
  if (k === "tf" && str(out.ww)) extra.ww = str(out.ww);
  if (k === "ms" && Array.isArray(out.whys)) extra.o = item.o.map((o, i) => [o[0], o[1], o[2] || str(out.whys[i])]);
  const alt = (Array.isArray(out.alt) ? out.alt : []).map((v) => normQ(v, k)).filter(Boolean).slice(0, 2);
  if (alt.length) extra.alt = alt;
  return extra;
}

// ================= Manage a subsection (rename, delete material, delete subsection) =================
function manageSection(sid, s, sec) {
  const box = el("div", "more");
  const f = el("form", "row"); const inp = el("input"); inp.type = "text"; inp.id = "ren-" + sec.id; inp.value = sec.name; inp.className = "grow"; inp.setAttribute("aria-label", "Subsection name");
  const sb = el("button", "btn small", "Rename"); sb.type = "submit"; f.append(inp, sb);
  f.addEventListener("submit", (e) => { e.preventDefault(); const name = inp.value.trim(); if (!name) return; saveSubject(sid, { ...s, sections: s.sections.map((x) => (x.id === sec.id ? { ...x, name, renamed: true } : x)) }); renderSubject(); });
  box.append(f);
  const ps = (packs[sid] || []).filter((p) => p.sec === sec.id);
  box.append(el("span", "small muted", ps.length ? "Material in this subsection:" : "No material yet."));
  for (const p of ps) {
    const r = el("div", "src"); r.append(el("span", "grow", `${p.own ? p.src : "Course question bank"} · ${(p.items || []).length} question${(p.items || []).length === 1 ? "" : "s"}`));
    if (!p.own) { r.append(el("span", "small muted", "from library")); box.append(r); continue; }
    if (subjectConfirm === "pack:" + p.id) r.append(btn("btn danger small", "Delete", async () => { await savePacks(sid, (packs[sid] || []).filter((x) => x !== p)); await refreshLocal(sid); subjectConfirm = null; toast("Deleted."); renderSubject(); }), btn("btn ghost small", "Keep", () => { subjectConfirm = null; renderSubject(); }));
    else r.append(btn("linkbtn", "Delete", () => { subjectConfirm = "pack:" + p.id; renderSubject(); }));
    box.append(r);
  }
  const libSec = ps.some((p) => !p.own);
  if (!libSec) {
    if (subjectConfirm === "sec:" + sec.id) box.append(confirmBox(`Delete "${sec.name}" and its ${ps.reduce((n, p) => n + (p.items || []).length, 0)} questions?`, "Delete subsection", async () => {
      await savePacks(sid, (packs[sid] || []).filter((x) => x.sec !== sec.id)); const s2 = subjects[sid]; saveSubject(sid, { ...s2, sections: s2.sections.filter((x) => x.id !== sec.id) }); await refreshLocal(sid); subjectConfirm = null; subjectOpenMore = null; renderSubject(); }));
    else if (s.sections.length > 1) box.append(btn("linkbtn", "Delete this subsection", () => { subjectConfirm = "sec:" + sec.id; renderSubject(); }));
  }
  return box;
}

// ================= Settings: question making =================
function aiSettings() {
  const r = el("div", "setrow"); r.append(el("h3", null, "Question making"));
  const has = !!apiKey();
  r.append(el("p", "small muted", has ? "Your API key is saved on this phone only. It's never included in backups." : "Nion uses your own Anthropic API key to turn photos, notes and files into questions. It's billed by Anthropic separately from any Claude plan: you add prepaid credit, and each file uses a small amount."));
  if (!has) {
    const ol = el("ol", "steps");
    ["Go to console.anthropic.com and sign up (you can use the same email as Claude).", "Open Billing and add some prepaid credit.", "Open API Keys, tap Create Key, name it Nion, and copy the key (it starts with sk-ant-).", "Paste it below and tap Save key."].forEach((x) => ol.append(el("li", null, x)));
    r.append(ol);
  }
  const f = el("form", "row"); const k = el("input"); k.type = "password"; k.id = "apikey"; k.autocomplete = "off"; k.placeholder = has ? "•••••••• saved" : "sk-ant-…"; k.className = "grow"; k.setAttribute("aria-label", "Anthropic API key");
  const sv = el("button", "btn small", "Save key"); sv.type = "submit"; f.append(k, sv);
  const msg = el("p", "small"); msg.id = "keymsg";
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); const v = k.value.trim(); if (!v) { msg.textContent = "Paste your key first."; return; }
    lsSet("md-apikey", v); msg.textContent = "Testing your key…"; sv.disabled = true;
    try { await callClaude([{ type: "text", text: "Reply with the word OK." }], { maxTokens: 5 }); msg.textContent = "Key works. You can make questions from files now."; k.value = ""; k.placeholder = "•••••••• saved"; }
    catch (err) { msg.textContent = err.message; if (err.code === "badkey") lsSet("md-apikey", ""); }
    sv.disabled = false;
  });
  r.append(f, msg);
  const mrow = el("div", "seg");
  for (const md of MODELS) { const b = btn("segbtn" + (apiModel() === md.id ? " on" : ""), md.name, () => { lsSet("md-model", md.id); renderSettings(); }); b.title = md.note; mrow.append(b); }
  r.append(el("span", "small muted", "Quality"), mrow);
  if (has) r.append(btn("linkbtn", "Remove key from this phone", () => { lsSet("md-apikey", ""); toast("Key removed."); renderSettings(); }));
  return r;
}

async function boot() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  rerender();
  await loadLibrary();
  if (!lsGet("md-booted", false) && library) {
    for (const e of library.filter((x) => x.auto)) { try { await installDeck(await fetchDeck(e)); } catch (err) {} }
    lsSet("md-booted", true);
  }
  // Question sets update themselves (progress is kept), unless you're in the middle of studying them.
  if (library) {
    for (const sid of Object.keys(subjects).filter((x) => subjects[x].lib && hasUpdate(x))) {
      if ((route.v === "study" || route.v === "quiz") && route.sid === sid) continue;
      try { await installDeck(await fetchDeck(libEntry(sid))); toast(`"${subjects[sid].name}" questions updated. Your progress is kept.`); } catch (e) {}
    }
  }
  if (route.v === "home" || route.v === "subject") rerender();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
}

boot();
})();

<script>
// ================= Night scene: drifting spores + distant lightning =================
(() => {
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.getElementById("spores"); if (!cv) return;
  const ctx = cv.getContext("2d"); let W = 0, H = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
  const sprite = (r, g, b) => { const c = document.createElement("canvas"); c.width = c.height = 32; const x = c.getContext("2d"); const gr = x.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.25, `rgba(${r},${g},${b},.55)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`); x.fillStyle = gr; x.fillRect(0, 0, 32, 32); return c; };
  const pale = sprite(225, 235, 255), ember = sprite(255, 90, 100);
  let P = [];
  const resize = () => { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  const spawn = (y) => ({ x: Math.random() * W, y: y != null ? y : Math.random() * H, s: 4 + Math.random() * 10, vy: -(.08 + Math.random() * .25), ph: Math.random() * 6.28, sw: .2 + Math.random() * .5, a: .25 + Math.random() * .55, red: Math.random() < .14 });
  resize(); P = Array.from({ length: Math.round(Math.min(46, W / 9)) }, () => spawn());
  addEventListener("resize", resize);
  let last = 0, running = true;
  const draw = (t) => {
    if (!running) return;
    if (t - last < 33) { requestAnimationFrame(draw); return; } last = t;
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      if (!reduce) { p.y += p.vy; p.x += Math.sin(t / 1600 + p.ph) * p.sw * .35; if (p.y < -20) Object.assign(p, spawn(H + 10)); }
      const tw = reduce ? 1 : .65 + .35 * Math.sin(t / 900 + p.ph * 3);
      ctx.globalAlpha = p.a * tw; ctx.drawImage(p.red ? ember : pale, p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    if (reduce) return; requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  document.addEventListener("visibilitychange", () => { running = !document.hidden; if (running) requestAnimationFrame(draw); });
  if (reduce) return;
  const flash = document.getElementById("flash"), bolt = document.getElementById("bolt");
  const strike = () => {
    if (!document.hidden) { for (const e of [flash, bolt]) { e.classList.remove("on"); void e.offsetWidth; e.classList.add("on"); } bolt.style.left = (35 + Math.random() * 45) + "%"; }
    setTimeout(strike, 16000 + Math.random() * 26000);
  };
  setTimeout(strike, 5000 + Math.random() * 6000);
})();
</script>
